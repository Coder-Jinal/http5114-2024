<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Coding from Scratch Exercises</title>

	<link rel="stylesheet" type="text/css" href="assets/style.css">
	<script src="assets/script.js"></script>
</head>
<body>
	<header>
		<h1>Coding from Scratch Exercises</h1>
	  </header>
	  <main>
		<!-- Accordion Section -->
		<section>
		  <h2 class="section-title">Accordion</h2>
		  <button class="accordion">Section 1</button>
		  <div class="panel">
			<p>Content for section 1 goes here.</p>
		  </div>
		  <button class="accordion">Section 2</button>
		  <div class="panel">
			<p>Content for section 2 goes here.</p>
		  </div>
		  <button class="accordion">Section 3</button>
		  <div class="panel">
			<p>Content for section 3 goes here.</p>
		  </div>
		</section>
	
		<!-- Slideshow Section -->
		<section>
		  <h2 class="section-title">Slideshow</h2>
		  <div class="slideshow-container">
			<div class="mySlides fade">
			  <img src="./assets/images/beach.png" alt="img1">
			</div>
			<div class="mySlides fade">
			  <img src="./assets/images/city.jpg" alt="img2">
			</div>
			<div class="mySlides fade">
			  <img src="./assets/images/hills.jpg" alt="img3">
			</div>
			<div class="mySlides fade">
				<img src="./assets/images/red.png" alt="img4">
			  </div>
			<button class="prev" onclick="plusSlides(-1)">&#10094;</button>
			<button class="next" onclick="plusSlides(1)">&#10095;</button>
		  </div>
		</section>
	
		<!-- Books Section -->
		<section>
		  <h2 class="section-title">Books API</h2>
		  <div id="bookList" class="book-container"></div>
		</section>
	
		<!-- Monty Hall Game Section -->
		<section>
		  <h2 class="section-title">Monty Hall Game</h2>
		  <div id="resultMonty" class="game-result"></div>
		  <div class="button-group">
			<button onclick="playGame(1)">Choose Door 1</button>
			<button onclick="playGame(2)">Choose Door 2</button>
			<button onclick="playGame(3)">Choose Door 3</button>
		  </div>
		</section>
		
	  </main>

</body>
</html>
